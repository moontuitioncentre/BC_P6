<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Meaning Test V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box;}

html{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

body{
    margin:0;
    font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    transition:0.3s;
    width:100%;
    max-width:100vw;
    overflow-x:hidden;
    box-sizing:border-box;
}

/* =======================
   Meaning Test 核心
======================= */

.card{
    font-size:clamp(40px,12vw,80px);
    margin-bottom:30px;
    text-align:center;
    word-break:break-word;
}

.question{
    font-size:25px;
    margin-bottom:20px;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,300px));
    gap:15px;
    justify-content:center;
}

.option-btn{
    width:300px;
    font-size:22px;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:10px;
    background:#cccccc;
    color:rgb(0,0,0);
    cursor:pointer;
}

.option-btn:hover{
    opacity:0.8;
}

.option-btn:disabled{
    cursor:default;
}

.option-btn small{
    display:block;
    font-size:20px;
    margin-top:5px;
    opacity:0.8;
}

.correct{
    background:#00ff88 !important;
}

.wrong{
    background:#ff0019 !important;
}

.next-btn {

  display:block;

  margin:25px auto 0 auto;

  font-size:20px;

  background:#FFB800;

  color:rgb(0, 0, 0);

  padding:10px 25px;

  border:none;

  border-radius:8px;

}

.save-progress-btn{
    background:#673ab7;
    color:white;
    font-size:18px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    margin:10px;
}

.restart-btn{
    margin-top:30px;
    font-size:20px;
    background:#333;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:8px;
}

.range-btn{
    background:#4CAF50;
    color:white;
    font-size:18px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    margin:10px;
}

.result{
    font-size:25px;
    text-align:center;
}

.wrong-list{
    margin-top:20px;
    color:red;
    font-size:20px;
}

/* =======================
   Meaning Test 原本结果设计
======================= */

.pass-card,
.fail-card{
    width:320px;
    padding:35px 20px;
    border-radius:25px;
    text-align:center;
    margin:25px auto;
}

.pass-card{
    background:#c8f7c5;
}

.fail-card{
    background:#ffd6d6;
}

.result-icon{
    font-size:60px;
}

.result-title{
    font-size:50px;
    font-weight:bold;
    margin-top:15px;
}

.pass-card .result-title{
    color:#28a745;
}

.fail-card .result-title{
    color:#d32f2f;
}

.result-message{
    font-size:24px;
    margin-top:25px;
}

.pass-card .result-message{
    color:#28a745;
}

.fail-card .result-message{
    color:#d32f2f;
}

/* =======================
   学生登录
======================= */

#loginScreen{
    text-align:center;
    width:90%;
    max-width:500px;
}

#loginScreen h1{
    font-size:32px;
    margin-bottom:30px;
}

#loginScreen input,
#loginScreen select{
    width:100%;
    box-sizing:border-box;
    font-size:22px;
    padding:15px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
}

#testScreen{
    width:100%;
    text-align:center;
}

/* =======================
   Dashboard
======================= */

#teacherDashboard{
    width:100%;
    margin-top:40px;
    text-align:center;
}

#teacherDashboard h2{
    font-size:24px;
}

.result-table{
    width:100%;
    max-width:100%;
    font-size:clamp(10px,2.8vw,14px);
    table-layout:fixed;
    border-collapse:collapse;
}

.result-table th{
    background:#1e3a5f;
    color:white;
    padding:10px;
}

.result-table td{
    border:1px solid #ddd;
    padding:10px;
}

.result-table th,
.result-table td{
    word-break:break-word;
    overflow-wrap:break-word;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.detail-btn{
    width:45px;
    height:35px;
    padding:0;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.result-table td:last-child{
    text-align:center;
    vertical-align:middle;
}

/* =======================
   完成成绩页面
======================= */

body.result-mode{
    min-height:100vh;
    height:auto;
    overflow-y:auto;
    justify-content:flex-start;
    padding-top:10px;
    padding-bottom:20px;
    box-sizing:border-box;
    background:#fff7ed;
}

body.result-mode #testScreen{
    height:auto;
    overflow:visible;
}

.result-card{
    width:100%;
    max-width:380px;
    margin:0 auto;
    box-sizing:border-box;
    background:#fff7ed;
    border-radius:15px;
    padding:10px;
    overflow:hidden;
}

.result-stats{
    background:white;
    border-radius:15px;
    overflow:hidden;
    margin-top:20px;
}

.stat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    font-size:18px;
    border-bottom:1px solid #eee;
}

.stat-row:last-child{
    border-bottom:none;
}

.stat-value{
    font-weight:bold;
    font-size:22px;
}

.correct-num{
    color:green;
}

.wrong-num{
    color:red;
}

.rate-num{
    color:#1565c0;
}

.wrong-box{
    background:#dceafa;
    padding:12px;
    margin-top:20px;
    margin-bottom:5px;
    border-radius:15px;
    text-align:center;
    box-sizing:border-box;
}

.wrong-icon{
    font-size:24px;
    margin-bottom:4px;
}

.wrong-title-cn{
    font-size:17px;
    font-weight:bold;
    margin-bottom:3px;
}

.wrong-title-en{
    font-size:16px;
    font-weight:bold;
    margin-bottom:3px;
}

.wrong-title-bm{
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.wrong-word{
    background:rgba(255,255,255,0.45);
    color:#1565c0;
    padding:10px 8px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    line-height:1.5;
    word-break:break-word;
}

.result-header-row{
    display:flex;
    align-items:stretch;
    justify-content:space-between;
    gap:12px;
    width:100%;
    margin-bottom:20px;
}

.result-header-row .student-info{
    flex:1;
    min-width:0;
    font-size:15px;
    line-height:1.9;
    margin:0;
    color:#555;
    text-align:left;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.result-header-row .pass-box,
.result-header-row .fail-box{
    width:95px;
    min-width:95px;
    padding:8px;
    border-radius:10px;
    flex-shrink:0;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-sizing:border-box;
}

.pass-box,
.fail-box{
    font-size:24px;
    font-weight:bold;
    padding:8px;
    border-radius:12px;
    margin:0;
}

.pass-box{
    background:#d8ffd8;
    color:#2e7d32;
}

.fail-box{
    background:#ffd6d6;
    color:#c62828;
}

.pass-main,
.fail-main{
    font-size:28px;
    font-weight:900;
    line-height:1;
}

.pass-small{
    font-size:15px;
    font-weight:normal;
    line-height:1.3;
}

.fail-small{
    font-size:10px;
    font-weight:normal;
    line-height:1.3;
}

.pass-icon,
.sad-icon{
    width:55px;
    height:55px;
    margin-top:5px;
    object-fit:contain;
}

.info-row{
    margin:4px 0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
}

.info-label{
    font-size:13px;
    color:#555;
    flex-shrink:0;
}

.info-value{
    font-size:15px;
    font-weight:bold;
    color:#0d47a1;
    background:#dbeafe;
    padding:4px 8px;
    border-radius:6px;
    display:inline-block;
    white-space:nowrap;
    border-left:3px solid #1565c0;
}

.result-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-top:10px;
    padding:0 22px;
    width:100%;
    box-sizing:border-box;
}

.save-result-btn,
.restart-result-btn{
    font-size:18px !important;
    padding:0 22px !important;
    margin:0 !important;
    border:none;
    border-radius:10px;
    cursor:pointer;
    height:44px;
    min-width:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
}

.save-result-btn{
    background:#ffd900;
}

.restart-result-btn{
    background:#333;
    color:white;
}

.app-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#fff7ed;
    border-radius:15px;
    padding:10px 12px;
    margin-bottom:15px;
    box-sizing:border-box;
}

.moon-logo{
    width:55px;
    height:55px;
    object-fit:contain;
}

.app-header-text{
    text-align:left;
}

.app-title{
    font-size:18px;
    font-weight:900;
    color:#17365d;
    letter-spacing:0.5px;
}

.app-subtitle{
    font-size:9px;
    font-weight:bold;
    color:#315b8a;
    margin-top:3px;
}

.footer-wave{
    width:calc(100% + 20px);
    margin-left:-10px;
    margin-top:20px;
    line-height:0;
}

.footer-wave img{
    width:100%;
    height:auto;
    display:block;
}

/* =======================
   学生进度详情弹窗
======================= */

.detail-modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:9999;
    overflow-y:auto;
}

.detail-box{
    width:380px;
    max-width:380px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-sizing:border-box;
    text-align:center;
    color:#222;
}

.detail-box *{
    font-family:Arial,"Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

.detail-info{
    background:#f5f9ff;
    padding:12px;
    border-radius:12px;
    text-align:left;
    line-height:1.8;
    color:#222;
}

.detail-list{
    margin-top:15px;
    max-height:45vh;
    overflow-y:auto;
    text-align:left;
    padding-right:5px;
}

.detail-item{
    padding:10px;
    margin-bottom:5px;
    border-radius:10px;
    background:#f8fafc;
    font-size:16px;
    font-weight:bold;
}

.detail-close,
.detail-download{
    margin-top:15px;
    width:80%;
    font-size:18px;
    padding:10px;
    border-radius:12px;
    border:none;
}

.detail-close{
    background:#333;
    color:white;
}

.detail-download{
    background:#1565c0;
    color:white;
}

/* =========================
   小屏幕高度自动缩放
========================= */

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

    .option-btn{
        width:min(300px,90vw);
        margin:5px auto;
    }

    .result-header-row{
        gap:10px;
    }

    .result-header-row .student-info{
        font-size:14px;
    }

    .result-header-row .pass-box,
    .result-header-row .fail-box{
        width:95px;
        min-width:95px;
        height:auto;
    }
}

@media(max-height:700px) and (max-width:600px){

    body{
        transform:scale(0.85);
        transform-origin:top center;
        width:117.6%;
        min-height:117.6vh;
    }

    #loginScreen{
        max-width:350px;
    }

    #loginScreen h1{
        font-size:26px;
        margin-bottom:15px;
    }

    #loginScreen input,
    #loginScreen select{
        font-size:18px;
        padding:10px;
        margin:5px 0;
    }

    button{
        padding:8px 15px;
        margin:5px;
        font-size:18px;
    }

    #teacherDashboard{
        margin-top:20px;
    }

    #teacherDashboard h2{
        font-size:20px;
    }

    .result-table th,
    .result-table td{
        padding:6px;
    }
}

/* =========================
   Login / Dashboard 按钮美化
   ========================= */

/* =====================
开始测试按钮
===================== */

.start-test-btn{

    width:180px;

    height:55px;

    border:none;

    border-radius:15px;

    background:linear-gradient(
        135deg,
        #2196F3,
        #1565C0
    );

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    margin-top:15px;

    box-shadow:
    0 5px 12px rgba(0,0,0,0.2);

    transition:0.3s;

}


/* 鼠标经过 */

.start-test-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 18px rgba(0,0,0,0.25);

}


/* 点击效果 */

.start-test-btn:active{

    transform:scale(0.95);

}


/* 更新成绩记录 */

.update-record-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    height:42px;

    padding:0 18px;

    border:none;
    border-radius:10px;

    background:#e3f2fd;
    color:#1565c0;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 2px 6px rgba(21,101,192,0.12);
    
    margin-bottom:18px;   /* ← 加这一行 */

    transition:
        background 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.update-record-btn:hover{
    background:#bbdefb;
    transform:translateY(-1px);
    box-shadow:0 4px 9px rgba(21,101,192,0.18);
}

.update-record-btn:active{
    transform:translateY(1px);
}

/* =====================
测试模式按钮
===================== */

#testModeBox{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:20px;

}


.mode-btn{

    width:140px;

    height:55px;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:0 4px 10px rgba(0,0,0,0.15);

}


/* 顺着测试 */

.normal-mode{

    background:linear-gradient(
        135deg,
        #42a5f5,
        #1976d2
    );

    color:white;

}


/* 随机测试 */

.random-mode{

    background:linear-gradient(
        135deg,
        #66bb6a,
        #2e7d32
    );

    color:white;

}



/* 手指按下效果 */

.mode-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 15px rgba(0,0,0,0.2);

}


.mode-btn:active{

    transform:scale(0.95);

}

.mode-title{

font-size:18px;

font-weight:bold;

color:#333;

margin-top:20px;

margin-bottom:10px;

text-align:center;

}

.back-btn {
  font-size: 18px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background-color: #6c757d;
  color: white;
  cursor: pointer;
  margin-bottom: 20px;
}

.back-btn:hover {
  opacity: 0.85;
}

</style>
</head>

/* ==================================================
   自动生成选择题
   ======= 保持你提供的核心逻辑 =======
   ================================================== */

function createQuestions(sourceWords){

    return sourceWords.map(item=>{

        let wrongAnswers =
        shuffle(
            sourceWords.filter(
                w => w.bm !== item.bm
            )
        ).slice(0,3);


        let options =
        shuffle([
            item,
            ...wrongAnswers
        ]);


        return {

            word:item.en,

            answer:item.zh,

            options:options

        };

    });

}


/* ==================================================
   随机
   ================================================== */

function shuffle(array){

    return array.sort(
        ()=>Math.random()-0.5
    );

}

function checkAnswer(
    answer,
    clickedBtn
){

    if(answered){

        return;

    }


    answered = true;


    let q =
    list[current];


    let buttons =
    document.querySelectorAll(
        ".option-btn"
    );


    buttons.forEach(btn=>{

        btn.disabled = true;

    });


    if(answer === q.answer){

        correct++;


        clickedBtn.classList.add(
            "correct"
        );


        document.body.style.background =
        "#c8f7c5";


        resultDiv.style.display =
        "block";

        testedWordsToday.push({

            word:q.word,

            result:"correct"

        });


    }
    else{

        wrong++;


        wrongWords.push(
            q.word
        );


        clickedBtn.classList.add(
            "wrong"
        );


        buttons.forEach(btn=>{

            if(
                btn.innerText.includes(
                    q.answer
                )
            ){

                btn.classList.add(
                    "correct"
                );

            }

        });


        document.body.style.background =
        "#f8c6c6";


        resultDiv.style.display =
        "block";

        testedWordsToday.push({

            word:q.word,

            result:"wrong"

        });

    }


    document.getElementById(
        "nextBtn"
    ).style.display="block";

}

/* ==================================================
   选择词汇范围
   ================================================== */

function selectRange(){

    const start =
    prompt(
        "请输入开始词汇"
    );


    if(start === null){

        return;

    }


    const end =
    prompt(
        "请输入结束词汇"
    );


    if(end === null){

        return;

    }


    const startIndex =
    originalWords.findIndex(
        x =>
        x.en.toLowerCase() ===
        start.trim().toLowerCase()
    );


    const endIndex =
    originalWords.findIndex(
        x =>
        x.en.toLowerCase() ===
        end.trim().toLowerCase()
    );


    if(
        startIndex === -1 ||
        endIndex === -1 ||
        startIndex > endIndex
    ){

        alert(
            "词汇不存在，或范围不正确"
        );

        return;

    }


    meaningRange =
    originalWords.slice(
        startIndex,
        endIndex + 1
    );


    restart();

}

            "正确率：" +
            accuracy +
            "%"
        );


    }
    catch(error){

        console.error(
            "保存 Meaning Test 成绩失败:",
            error
        );


        alert(
            "❌ 保存成绩失败，请检查 Firebase 设置"
        );

    }

}


/* ==================================================
   Teacher Dashboard
   Meaning Test 独立 Dashboard
   ================================================== */

async function loadDashboard(){

    if(!window.firebaseReady){

        setTimeout(
            loadDashboard,
            500
        );

        return;

    }


    try{

        const snapshot =
        await window.getDocs(

            window.collection(
                window.db,
                "meaningProgress"
            )

        );


        let html = `

            <table class="result-table">

                <tr>

                    <th>学生</th>

                    <th>年级</th>

                    <th>进度</th>

                    <th>状态</th>

                    <th>保存时间</th>

                    <th>详情</th>

                </tr>

        `;


        snapshot.forEach(
            (docSnap)=>{

                const data =
                docSnap.data();


                let progress =
                (data.current || 0) +
                "/" +
                (data.totalWords || 0);


                let status =
                (
                    data.current >=
                    data.totalWords
                )
                ?
                "已完成"
                :
                "学习中";


                html += `

                    <tr>

                        <td>
                            ${data.studentName || "-"}
                        </td>

                        <td>
                            ${data.grade || "-"}
                        </td>

                        <td>
                            ${progress}
                        </td>

                        <td
                            class="${
                                status === "已完成"
                                ?
                                "pass"
                                :
                                ""
                            }"
                        >
                            ${status}
                        </td>

                        <td>

                            ${
                                data.updatedAt
                                ?
                                data.updatedAt
                                .toDate()
                                .toLocaleDateString(
                                    "en-GB"
                                )
                                +
                                "<br>"
                                +
                                data.updatedAt
                                .toDate()
                                .toLocaleTimeString(
                                    "en-GB",
                                    {
                                        hour:"2-digit",
                                        minute:"2-digit"
                                    }
                                )
                                :
                                "-"
                            }

                        </td>

                        <td>

                            <button
                                class="detail-btn"
                                onclick="openDetail('${docSnap.id}')"
                            >
                                📖
                            </button>

                        </td>

                    </tr>

                `;

            }
        );


        html +=
        "</table>";


        document.getElementById(
            "resultTable"
        ).innerHTML =
        html;


    }
    catch(error){

        console.error(
            "读取 Meaning Dashboard 失败:",
            error
        );


        document.getElementById(
            "resultTable"
        ).innerHTML =
        "读取失败";

    }

}


/* ==================================================
   重新开始确认
   ================================================== */

function confirmRestart(){

    let result =
    confirm(
        "确定要重新开始吗？\n\n" +
        "目前 Meaning Test 测试进度会全部清除。"
    );


    if(result){

        restart();

    }

}


/* ==================================================
   学生名单
   ================================================== */

function loadStudents(){

    const grade =
    document.getElementById(
        "studentGrade"
    ).value;


    const nameSelect =
    document.getElementById(
        "studentName"
    );


    nameSelect.innerHTML = `

        <option value="">
            请选择学生
        </option>

    `;


    if(!grade){

        return;

    }


    if(!students[grade]){

        return;

    }


    students[grade].forEach(
        name=>{

            let option =
            document.createElement(
                "option"
            );


            option.value =
            name;


            option.textContent =
            name;


            nameSelect.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   学生详情
   ================================================== */

async function openDetail(id){

    console.log(
        "点击 Meaning Test 详情:",
        id
    );


    try{

        const ref =
        window.doc(
            window.db,
            "meaningProgress",
            id
        );


        const snap =
        await window.getDoc(ref);


        if(snap.exists()){

            showDetail(
                snap.data()
            );

        }
        else{

            alert(
                "找不到学生资料"
            );

        }

    }
    catch(error){

        console.error(
            "读取 Meaning Test 详情失败:",
            error
        );


        alert(
            "读取失败，请看 Console"
        );

    }

}


/* ==================================================
   显示未完成进度详情
   ================================================== */

function showDetail(data){

    if(
        data.current >=
        data.totalWords
    ){

        showFinalReport(
            data
        );

        return;

    }


    let listHTML = "";


    const todayWords =
    data.testedWordsToday ||
    [];


    todayWords.forEach(
        item=>{

            if(
                item.result ===
                "correct"
            ){

                listHTML += `

                    <div class="detail-item">
                        ✅ ${item.word}
                    </div>

                `;

            }
            else{

                listHTML += `

                    <div class="detail-item">
                        ❌ ${item.word}
                    </div>

                `;

            }

        }
    );


    document.getElementById(
        "detailContent"
    ).innerHTML = `

        <b>
            👤 Student / 学生 / Murid：
        </b>
        ${data.studentName || "-"}

        <br>

        <b>
            📚 Year / 年级 / Tahun：
        </b>
        ${data.grade || "-"}

        <br>

        <b>
            📝 Test / 测试 / Ujian：
        </b>
        ${data.testName || "-"}

        <br>

        <hr>

        <b>
            📊 Progress / 进度 / Kemajuan：
        </b>
        ${data.current || 0}/${data.totalWords || 0}

        <br><br>

        <b>
            今日测验词汇<br>
            Today's Quiz Vocabulary<br>
            Kosa Kata Kuiz Hari Ini
        </b>

        <div class="detail-list">

            ${
                listHTML ||
                "<div class='detail-item'>暂无记录</div>"
            }

        </div>

        <br>

        ✅：
        ${data.correct || 0}

        <br>

        ❌：
        ${data.wrong || 0}

    `;


    document.getElementById(
        "detailModal"
    ).style.display =
    "flex";

}


/* ==================================================

        data.totalWords *

    0;


    let statusHTML = "";

/* ==================================================
   下载报告
   ================================================== */

function downloadDetail(){

    const report =
    document.querySelector(
        ".detail-box"
    );


    const buttons =
    report.querySelectorAll(
        "button"
    );


    buttons.forEach(
        btn=>{
            btn.style.display="none";
        }
    );


    const oldHeight =
    report.style.maxHeight;


    const oldOverflow =
    report.style.overflow;


    report.style.maxHeight =
    "none";


    report.style.overflow =
    "visible";


    html2canvas(
        report,
        {

            scale:6,

            backgroundColor:"#ffffff",

            useCORS:true,

            logging:false,

            allowTaint:true,

            removeContainer:true

        }
    )
    .then(
        canvas=>{

            let link =
            document.createElement(
                "a"
            );


            link.download =
            "Meaning_Report_" +
            (currentStudentName || "Student") +
            "_" +
            new Date()
            .toLocaleDateString(
                "en-GB"
            )
            .replace(
                /\//g,
                "-"
            ) +
            ".png";


            link.href =
            canvas.toDataURL(
                "image/png"
            );


            link.click();


            buttons.forEach(
                btn=>{
                    btn.style.display =
                    "block";
                }
            );


            report.style.maxHeight =
            oldHeight;


            report.style.overflow =
            oldOverflow;

        }
    )
    .catch(
        error=>{

            console.error(
                "下载 Meaning Report 失败:",
                error
            );


            buttons.forEach(
                btn=>{
                    btn.style.display =
                    "block";
                }
            );


            report.style.maxHeight =
            oldHeight;


            report.style.overflow =
            oldOverflow;


            alert(
                "❌ 下载报告失败"
            );

        }
    );

}
