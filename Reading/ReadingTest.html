function checkAnswer(text){

    if(isChecking){
        return;
    }

    isChecking = true;

    if(!words[current]){
        isChecking = false;
        return;
    }

    const answer = normalizeChinese(words[current]);

    const cleanText = normalizeChinese(text);

    console.log(
        "学生:",
        cleanText,
        "答案:",
        answer
    );

    let similarity = chineseSimilarity(
        cleanText,
        answer
    );

    console.log(
        "中文相似度:",
        similarity
    );

    // 中文判断标准
    let threshold = 0.75;

    // 如果是非常短的单字
    if(answer.length === 1){

        threshold = 1;

    }

    // 两个字的词
    else if(answer.length === 2){

        threshold = 0.75;

    }

    // 三个或以上
    else{

        threshold = 0.70;

    }


    if(similarity >= threshold){

        stopListening();

        isChecking = false;

        correct++;

        testedWordsToday.push({

            word: words[current],

            result:"correct"

        });

        document.body.className =
        "correct";

        resultDiv.innerHTML =
        "✅ 正确！";


        setTimeout(()=>{

            current++;

            if(current < words.length){

                showWord();

            }

            else{

                showResult();

            }

        },800);


    }

    else{

        isChecking = false;

        const currentWord =
        words[current];


        const exist =
        testedWordsToday.find(
            x => x.word === currentWord
        );


        if(!exist){

            testedWordsToday.push({

                word: currentWord,

                result:"wrong"

            });

        }


        wrong++;


        if(!wrongWords.includes(currentWord)){

            wrongWords.push(currentWord);

        }


        document.body.className =
        "incorrect";


        resultDiv.innerHTML =
        "❌ 再试一次";

    }

}

// =======================
// 英文发音相似度判断
// =======================

function getSimilarity(a,b){

    if(a.includes(b) || b.includes(a)){
        return 1;
    }


    let longer =
    a.length > b.length ? a : b;


    let shorter =
    a.length > b.length ? b : a;


    let longerLength =
    longer.length;


    if(longerLength === 0){
        return 1;
    }


    let distance =
    levenshtein(longer, shorter);


    return (
        longerLength - distance
    ) / longerLength;

}



// 编辑距离算法

function levenshtein(a,b){

let matrix=[];


for(let i=0;i<=b.length;i++){

matrix[i]=[i];

}


for(let j=0;j<=a.length;j++){

matrix[0][j]=j;

}



for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){


if(
b.charAt(i-1)
===
a.charAt(j-1)
){

matrix[i][j]=matrix[i-1][j-1];

}

else{


matrix[i][j]=Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j]+1

);


}


}

}


return matrix[b.length][a.length];

}

}).then(canvas=>{

});


}

function normalizeChinese(text){

    return text
        .trim()
        .replace(/[，。！？、；：“”‘’（）,.!?;:"'「」『』]/g,"")
        .replace(/\s+/g,"");

}

function chineseSimilarity(a,b){

    a = normalizeChinese(a);

    b = normalizeChinese(b);


    if(a === b){

        return 1;

    }


    if(!a || !b){

        return 0;

    }


    let distance =
    levenshtein(a,b);


    let maxLength =
    Math.max(
        a.length,
        b.length
    );


    return (
        maxLength - distance
    ) / maxLength;

}
